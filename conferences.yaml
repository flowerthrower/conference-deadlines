schema_version: 1
policy: Only exact deadlines confirmed by an official conference source become calendar events. Discovery windows are hints only.

# This is the only maintained conference registry.
# Keep IDs stable because deadline events refer to them.
# Add every submission category that the daily sweep should monitor.
# Include recurring main conference series only; do not add individual workshops.
conferences:
  - id: iccad
    community: Design Automation
    name: ICCAD
    aliases: []
    discovery_windows: [mid April]
    monitored_submissions:
      - abstract registration
      - regular paper
      - workshop proposal
      - tutorial proposal
      - special-session proposal
      - panel proposal
    official_sources:
      - url: https://iccad.com/2026
        title: Official ICCAD site
        status: 2027 deadlines not announced
    last_checked: "2026-08-18T11:49:39Z"

